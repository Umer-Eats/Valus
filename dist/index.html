  <!-- Migrate earlier brand storage before reading the current theme. -->
  <script>try{for(const prefix of ['kalus-','halus-']){for(const key of Object.keys(localStorage)){if(!key.startsWith(prefix))continue;const next='valus-'+key.slice(prefix.length);if(localStorage.getItem(next)===null)localStorage.setItem(next,localStorage.getItem(key));localStorage.removeItem(key);}}}catch{}try{document.documentElement.dataset.theme=localStorage.getItem('valus-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme='light'}</script>
